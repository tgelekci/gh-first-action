name: Demo Workflow
on: [workflow_dispatch, push]
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print greeting
        run: echo "Hello World!"
      - name: Print first job
        run: echo "First job!"
  second-job:
    runs-on: ubuntu-latest
    needs: first-job
    outputs:
      first-output: ${{ steps.second_job.outputs.first-output }}
    steps:
      - name: Print second job
        id: second_job
        run: |
          echo "Second job!"
          echo "first-output=success!" >> $GITHUB_OUTPUT
      - name: Consume first output
        run: |
          echo "The status was: ${{ steps.second_job.outputs.first-output }}"
  third-job:
    runs-on: ubuntu-latest
    needs: second-job
    steps:
      - name: Print github metadata
        run: echo "${{toJson(github)}}"
      - name: Use output from second job
        run: |
          echo "Received: ${{ needs.second-job.outputs.first-output }}"
  final-job:
    runs-on: ubuntu-latest
    needs: third-job
    steps:
      - name: Print final job
        run: echo "Final job!"
      - name: Print ending
        run: echo "Done! Good bye!"
