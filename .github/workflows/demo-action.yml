name: Demo Workflow
on: [workflow_dispatch, push]
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print greeting
        run: echo "Hello World!"
      - name: Print first job
        run: echo "First job!"
  second-job:
    runs-on: ubuntu-latest
    needs: first-job
    steps:
      - name: Print second job
        run: echo "Second job!"
  third-job:
    runs-on: ubuntu-latest
    needs: second-job
    steps:
      - name: Print third job
        run: echo "Third job!"
      - name: Print ending
        run: echo "Done! Good bye!"
